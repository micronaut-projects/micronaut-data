name: Oracle Test Pilot CI
on:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
  pull_request:
    branches:
      - '[0-9]+.[0-9]+.x'

jobs:
  build_matrix:
    runs-on: [ self-hosted, Linux, X64, OracleTestPilot ]
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      # Provides the set of databases to test against as well as the list of modules to test
      - name: Build Matrix
        id: build-matrix
        shell: bash
        run: |
          echo 'matrix={"db":["base-database-service-26ai","autonomous-transaction-processing-serverless-26ai"], "native_test_task":["micronaut-doc-examples:micronaut-jdbc-example-records-java:nativeTest","micronaut-doc-examples:micronaut-jdbc-example-java:nativeTest","micronaut-doc-examples:micronaut-hibernate-example-java:nativeTest","micronaut-data-r2dbc:oracleTestPilotTest"]}' >> "$GITHUB_OUTPUT"

  build:
    needs: build_matrix
    runs-on: [ self-hosted, Linux, X64, OracleTestPilot ]
    strategy:
      max-parallel: 6
      matrix:
        java: ['25']
        native_test_task: ${{ fromJson(needs.build_matrix.outputs.matrix).native_test_task }}
        db: ${{ fromJson(needs.build_matrix.outputs.matrix).db }}
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
      DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
      DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}

    steps:
      - name: Remove system JDKs
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner image ships a ~/.gradle folder, so setup-gradle would skip restoring its cache and
      # every job would download all dependencies from Maven Central, which rate-limits the runners
      # (HTTP 429). Only the first setup-gradle step in a job takes effect, so this one runs before
      # Pre-Build Steps, whose own setup-gradle step then does nothing. setup-gradle runs `java` to
      # find the user home, so Java is set up first.
      - name: Set up Java for the Gradle cache restore
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Restore the Gradle cache over the runner's ~/.gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-overwrite-existing: true
          # Restore only: the entries saved by the other "build" jobs on 5.3.x hold most of what this
          # job needs, and saving more entries here would push those out of the repository's cache.
          cache-read-only: true

      - name: Pre-Build Steps
        uses: micronaut-projects/github-actions/graalvm/pre-build@bd80048acde40b1c50534529f8160b0a6a19d63b # master
        id: pre-build
        with:
          distribution: 'graalvm'
          gradle-java: '25'
          java: ${{ matrix.java }}
          nativeTestTask: ${{ matrix.native_test_task }}

      - name: Create Oracle Test Pilot Databases...
        id: create_database
        uses: oracle-actions/setup-testpilot@ad55a0d7294112c44a9cc9a38f4b3d293da8fcf0 # v1.0.31
        with:
          oci-service: ${{ matrix.db }}
          action: create
          user: ${{ matrix.native_test_task }}
          surround-connection-string-with-double-quotes: true

      - name: Disable TCP Fast Open for Autonomous databases
        id: disable_tfo
        run: |
          TESTPILOT_CONNECTION_STRING_SUFFIX=${{ steps.create_database.outputs.connection_string_suffix }}
          TESTPILOT_CONNECTION_STRING_SUFFIX_WO_TFO=${TESTPILOT_CONNECTION_STRING_SUFFIX//useTcpFastOpen=true/useTcpFastOpen=false}
          echo "TESTPILOT_CONNECTION_STRING_SUFFIX=$TESTPILOT_CONNECTION_STRING_SUFFIX_WO_TFO" >> $GITHUB_ENV
        shell: bash

      - name: Build Steps
        id: gradle
        env:
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GRAALVM_QUICK_BUILD: true
          TESTPILOT_USERNAME: ${{ matrix.native_test_task }}_${{ github.run_number }}
          TESTPILOT_PASSWORD: ${{ steps.create_database.outputs.database_password }}
          TESTPILOT_CONNECTION_STRING_SUFFIX: ${{ env.TESTPILOT_CONNECTION_STRING_SUFFIX }}
          API_HOST: ""
          TESTPILOT_CLIENT_ID: ""
          TESTPILOT_TOKEN: ""
          # Needed for TFO (TCP fast open)
          #LD_PRELOAD: /home/ubuntu/libtfojdbc1.so
          #LD_LIBRARY_PATH: /home/ubuntu
          # maximum number of worker (upper limit to maxParallelForks property, otherwise number of available CPUs)
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          PREDICTIVE_TEST_SELECTION: "${{ github.event_name == 'pull_request' && 'true' || 'false' }}"
        shell: bash
        run: |
          ./gradlew ${{ matrix.native_test_task }} --no-daemon --continue --stacktrace -Plog-test-progress=true

      - name: Delete Oracle Test Pilot Databases...
        id: delete_database
        if: always() && steps.create_database.outcome == 'success'
        uses: oracle-actions/setup-testpilot@ad55a0d7294112c44a9cc9a38f4b3d293da8fcf0 # v1.0.31
        with:
          oci-service: ${{ matrix.db }}
          action: delete
          user: ${{ matrix.native_test_task }}

      - name: Post-Build Steps
        uses: micronaut-projects/github-actions/graalvm/post-build@bd80048acde40b1c50534529f8160b0a6a19d63b # master
        id: post-build
        with:
          java: ${{ matrix.java }}
