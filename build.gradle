plugins {
    id "io.micronaut.build.internal.parent"
    id "io.micronaut.build.internal.data-dependencies"
}

repositories {
    mavenCentral()
}

// Project repositories are added by the shared build plugins, which take
// precedence over the settings repositories, so the snapshot repository has to
// be registered for every project as well.
allprojects {
    repositories {
        maven {
            name = 'mavenSnapshots'
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            mavenContent {
                snapshotsOnly()
            }
        }
    }
}

if (System.getenv("SONAR_TOKEN") != null) {
    sonarqube {
        properties {
            property "sonar.exclusions", "**/example/**, **/data/tck/**"
        }
    }
}

tasks.register('cleanBuildArtifacts', Delete) {
    group = 'cleanup'
    description = 'Removes Eclipse artifacts from project and all submodules'

    def pathsToDelete = []

    allprojects.each { proj ->
        pathsToDelete += [
                new File(proj.projectDir, 'bin'),
                new File(proj.projectDir, '.settings'),
                new File(proj.projectDir, '.classpath'),
                new File(proj.projectDir, '.project'),
                new File(proj.projectDir, '.factorypath'),
                new File(proj.projectDir, '.micronaut'),
        ]
    }

    delete pathsToDelete
}

