plugins {
    id "io.micronaut.build.internal.parent"
    id "io.micronaut.build.internal.data-dependencies"
    id "io.github.sfkamath.llm-build-compactor" version "0.1.3"
}

repositories {
    mavenCentral()
}

if (System.getenv("SONAR_TOKEN") != null) {
    sonarqube {
        properties {
            property "sonar.exclusions", "**/example/**"
        }
    }
}
