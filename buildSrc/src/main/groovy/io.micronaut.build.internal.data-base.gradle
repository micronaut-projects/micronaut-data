import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters

import java.time.Duration

plugins {
    id "java-library"
    id "io.micronaut.build.internal.data-dependencies"
    id 'net.ltgt.errorprone'
}

group "io.micronaut.data"
version projectVersion

tasks.withType(Javadoc).configureEach {
    // Generate Javadoc only for the public API and exclude generated descriptor package
    options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PUBLIC
    // Generated by Micronaut descriptor processor, not part of API docs
    exclude('**/io/micronaut/data/info/**')
    // Exclude example sources from aggregate Javadoc
    exclude('**/example/**')
    // Keep runtime sources included; only exclude descriptor package by name for aggregate javadoc
    options.addStringOption('exclude', 'io.micronaut.data.info')
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.encoding = "UTF-8"
    options.compilerArgs.addAll([
            '-parameters',
            // enables incremental compilation
            '-Amicronaut.processing.incremental=true',
            '-Amicronaut.processing.annotations=io.micronaut.data.*,io.micronaut.core.annotation.*,javax.persistence.*,jakarta.persistence.*',
            "-Amicronaut.processing.group=$project.group",
            "-Amicronaut.processing.module=$project.name",
    ])
}

tasks.withType(Test).configureEach {
    systemProperty "micronaut.cloud.platform", "OTHER"
    timeout = Duration.ofHours(1)
    if (micronautBuild.environment.githubAction.get()) {
        plugins.withId("io.micronaut.test-resources") {
            finalizedBy("stopTestResourcesService")
        }
    }
}

tasks.matching { it.name == "internalStartTestResourcesService" }.configureEach {
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
        setProperty("useClassDataSharing", false)
    }
}

configurations.configureEach {
    resolutionStrategy.preferProjectModules()
}

dependencies {
    errorprone libs.nullaway
    errorprone libs.error.prone.core
}

import net.ltgt.gradle.errorprone.CheckSeverity

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        check("NullAway", CheckSeverity.ERROR)
        check("MissingOverride", CheckSeverity.ERROR)
        option("NullAway:AnnotatedPackages", "io.micronaut.data")
        disable("MissingSummary")
        disable("ClassInitializationDeadlock")
    }
    // Disable Error Prone (including NullAway) on test code and TCK
    if (name.toLowerCase().contains("test") || project.name.contains("tck")) {
        options.errorprone.enabled = false
    }
}
