plugins {
    id "io.micronaut.build.internal.data-base"
    id "io.micronaut.build.internal.module"
    id "java-library"
}

repositories {
    mavenCentral()
}

dependencies {
    testRuntimeOnly mnSerde.micronaut.serde.jackson
    testRuntimeOnly(mnTest.junit.platform.suite)
    testRuntimeOnly(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
}

micronautBuild {
    descriptor {
        parentModuleId = "io.micronaut.data:micronaut-data-model"
    }
}

// Aggregates the tests of the library modules only: doc examples, benchmarks and test suites are excluded
def testModules = rootProject.tasks.names.contains("testModules") ? rootProject.tasks.named("testModules") : rootProject.tasks.register("testModules") {
    group = "verification"
    description = "Runs the tests of the Micronaut Data library modules"
}
def moduleTest = tasks.named("test")
testModules.configure {
    dependsOn(moduleTest)
}

test {
    useJUnitPlatform()
}
