plugins {
    id "io.micronaut.build.internal.data-module"
}

dependencies {
    api projects.micronautDataProcessor
    api projects.micronautDataGraphModel
    api mnSerde.micronaut.serde.processor
    api mnSerde.micronaut.serde.api
    implementation projects.micronautDataSerde

    compileOnly mn.micronaut.inject.java
    compileOnly mn.micronaut.inject.groovy

    testAnnotationProcessor mn.micronaut.inject.java

    testImplementation mn.micronaut.inject.groovy
    testImplementation mn.micronaut.inject.java.test
    testImplementation mn.micronaut.inject.groovy.test
    testImplementation(mnSql.jakarta.persistence.api)
}

micronautBuild {
    binaryCompatibility {
        enabledAfter("5.3.0")
    }
}
