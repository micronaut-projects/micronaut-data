plugins {
    id "io.micronaut.build.internal.data-module"
}

dependencies {
    annotationProcessor mn.micronaut.inject.java
    annotationProcessor mn.micronaut.graal

    api projects.micronautDataRuntime
    api projects.micronautDataGraphModel
    api projects.micronautDataConnection
    api mn.reactor
    api projects.micronautDataSerde
    api mnSerde.micronaut.serde.api
    implementation mnSerde.micronaut.serde.support

    compileOnly(mnSql.jakarta.persistence.api)

    testImplementation mnSerde.micronaut.serde.jackson
}

micronautBuild {
    binaryCompatibility {
        enabledAfter("5.3.0")
    }
}
