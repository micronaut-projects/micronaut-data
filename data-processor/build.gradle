plugins {
	id "io.micronaut.build.internal.data-module"
    id 'antlr'
}

// The Gradle ANTLR plugin wires its tooling configuration into `api`, which
// would otherwise expose the parser generator and all of its transitive
// dependencies at runtime. ANTLR is only needed to generate sources; the
// generated parser itself uses the runtime dependency declared below.
configurations.named("api") {
    setExtendsFrom(extendsFrom.findAll { it.name != "antlr" })
}

dependencies {
	api projects.micronautDataModel
	api(mnSql.jakarta.persistence.api)

	api libs.antlr.runtime

	compileOnly mn.micronaut.core.processor
    compileOnly libs.managed.jakarta.data.stateful
    compileOnly mn.micronaut.inject.java

    implementation mn.micronaut.sourcegen.generator
    implementation mn.micronaut.sourcegen.generator.java

    testAnnotationProcessor mn.micronaut.inject.java
	testAnnotationProcessor projects.micronautDataProcessor

	testImplementation mnReactor.micronaut.reactor
	testImplementation mn.micronaut.inject.groovy
    testImplementation mn.micronaut.inject.groovy.test
	testImplementation mn.micronaut.inject.java.test
	testImplementation(libs.managed.javax.persistence.api)
	testImplementation(mnSql.jakarta.transaction.api)
	testImplementation libs.spring.data.jpa
	testImplementation projects.micronautDataTck
	testImplementation projects.micronautDataTx
	testImplementation projects.micronautDataJdbc
    testImplementation libs.managed.jakarta.data.api
    testImplementation mn.micronaut.sourcegen.annotations
    testImplementation mn.jackson.annotations

    antlr libs.antlr
}

tasks.named("generateGrammarSource") {
    outputDirectory = file("$outputDirectory/io/micronaut/data/jq")
    arguments += ["-package", "io.micronaut.data.jq"]
}
