test-resources:
  containers:
    mssql:
      accept-license: true
      startup-timeout: 300s
    mariadb:
      startup-timeout: 300s
    mysql:
      startup-timeout: 300s
    oracle:
      startup-timeout: 600s
      # the slim image has no Oracle Text, which the full-text search specs need
      image-name: gvenzl/oracle-free:23-faststart
    postgres:
      startup-timeout: 300s

micronaut:
  http:
    client:
      read-timeout: 5m
