import io.micronaut.testresources.buildtools.KnownModules

plugins {
    id "io.micronaut.build.internal.data-example"
    id "io.micronaut.test-resources"
}

application {
    mainClass = "example.Application"
}

micronaut {
    version libs.versions.micronaut.platform.get()
    runtime "netty"
    testRuntime "junit5"
    testResources {
        enabled = true
        inferClasspath = false
        additionalModules.add(KnownModules.JDBC_POSTGRESQL)
        clientTimeout = 300
        version = libs.versions.micronaut.testresources.get()
    }
}

dependencies {
    annotationProcessor projects.micronautDataGraphProcessor

    implementation projects.micronautDataPostgresAge
    implementation(mnSql.jakarta.persistence.api)

    runtimeOnly mnSql.micronaut.jdbc.hikari
    runtimeOnly mnSql.postgresql
    runtimeOnly mnLogging.logback.classic

    testResourcesService mnSql.postgresql
}
