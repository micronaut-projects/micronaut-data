import io.micronaut.testresources.buildtools.KnownModules

plugins {
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.kotlin.kapt"
    id "org.jetbrains.kotlin.plugin.allopen"
    id "io.micronaut.build.internal.data-kotlin-example"
    id "io.micronaut.test-resources"
}

application {
    mainClass = "example.ApplicationKt"
}

micronaut {
    version libs.versions.micronaut.platform.get()
    runtime "netty"
    testRuntime "junit5"
    testResources {
        enabled = true
        inferClasspath = false
        additionalModules.add(KnownModules.R2DBC_POSTGRESQL)
        clientTimeout = 300
        version = libs.versions.micronaut.testresources.get()
    }
}

dependencies {
    kapt projects.micronautDataGraphProcessor

    implementation projects.micronautDataPostgresAgeR2dbc
    implementation mnKotlin.micronaut.kotlin.runtime
    implementation(mnSql.jakarta.persistence.api)

    runtimeOnly mnR2dbc.r2dbc.postgresql
    runtimeOnly mnLogging.logback.classic

    testResourcesService mnR2dbc.r2dbc.postgresql
}
