plugins {
    id "io.micronaut.build.internal.data-example"
}

micronaut {
    version libs.versions.micronaut.platform.get()
    runtime 'netty'
    testRuntime "junit5"
}

dependencies {
    annotationProcessor mn.micronaut.http.validation
    annotationProcessor projects.micronautDataProcessor
    annotationProcessor projects.micronautDataJpaMetamodelProcessor
    annotationProcessor mnSerde.micronaut.serde.processor

    implementation libs.managed.jakarta.data.api
    implementation mnSql.jakarta.persistence.api
    implementation mnSql.hibernate.core
    implementation mnSql.micronaut.hibernate.jpa
    implementation mnSql.micronaut.jdbc.hikari
    implementation projects.micronautDataHibernateJpa
    implementation mn.micronaut.http.client.core
    implementation mnSerde.micronaut.serde.jackson

    runtimeOnly mnLogging.logback.classic
    runtimeOnly mnSql.h2

    testImplementation mnTest.micronaut.test.junit5
}

application {
    mainClass = "com.example.Application"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            "-Amicronaut.data.jpa.metamodel.enabled=true"
    ]
}
// To test the metamodel generation when micronaut.data.jpa.metamodel.enabled=false
def disabledGenDir = layout.buildDirectory.dir("generated/metamodel-disabled")
def disabledClassesDir = layout.buildDirectory.dir("classes/metamodel-disabled")

tasks.register("compileMetamodelDisabled", JavaCompile) {
    doFirst {
        delete(disabledGenDir)
        delete(disabledClassesDir)
    }

    source = sourceSets.main.java
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = disabledClassesDir

    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs += [
            "-proc:only",
            "-s", disabledGenDir.get().asFile.absolutePath,
            "-Amicronaut.data.jpa.metamodel.enabled=false"
    ]
}

tasks.register("verifyMetamodelDisabled") {
    dependsOn("compileMetamodelDisabled")
    doLast {
        def generated = fileTree(disabledGenDir).matching { include "**/*_.java" }.files
        if (!generated.isEmpty()) {
            throw new GradleException("Expected no metamodel files when disabled; found: $generated")
        }
    }
}

tasks.named("test") {
    dependsOn("verifyMetamodelDisabled")
}

