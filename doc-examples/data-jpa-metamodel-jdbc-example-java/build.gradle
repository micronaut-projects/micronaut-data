plugins {
    id "java-library"
    id "io.micronaut.build.internal.data-example"
}

micronaut {
    version libs.versions.micronaut.platform.get()
    runtime 'netty'
    testRuntime "junit5"
}

dependencies {
    testAnnotationProcessor mn.micronaut.inject.java
    testAnnotationProcessor projects.micronautDataProcessor
    testAnnotationProcessor projects.micronautDataJpaMetamodelProcessor

    testImplementation libs.managed.jakarta.data.api
    testImplementation mnSql.jakarta.persistence.api
    testImplementation projects.micronautDocExamples.micronautDataJpaMetamodelEntitiesExampleJava
    testImplementation mnTest.micronaut.test.junit5
    testImplementation mnSerde.micronaut.serde.jackson
    testImplementation mn.micronaut.http.client.core

    testImplementation projects.micronautDataJdbc
    testImplementation projects.micronautDataProcessor
    testImplementation projects.micronautDataJdbc
    testImplementation mnValidation.micronaut.validation.processor
    testImplementation mnValidation.micronaut.validation

    testRuntimeOnly mnTest.junit.jupiter.engine
    testRuntimeOnly mnSql.micronaut.jdbc.tomcat
    testRuntimeOnly mnLogging.logback.classic
    testRuntimeOnly mnSql.h2

}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            "-Amicronaut.data.jpa.metamodel.enabled=true"
    ]
}

