plugins {
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.kotlin.kapt"
    id "org.jetbrains.kotlin.plugin.allopen"
    id "io.micronaut.build.internal.data-kotlin-example"
}

application {
    mainClass = "example.ApplicationKt"
}

micronaut {
    version libs.versions.micronaut.platform.get()
    runtime "netty"
    testRuntime "junit5"
}

dependencies {
    kapt projects.micronautDataDocumentProcessor
    kapt projects.micronautDataSearchDocument

    implementation projects.micronautDataSearchElasticsearch
    implementation mnSerde.micronaut.serde.jackson
    implementation mnKotlin.micronaut.kotlin.runtime
    implementation(mn.kotlinx.coroutines.core)
    implementation(mn.kotlinx.coroutines.reactive)
    implementation(mn.kotlinx.coroutines.reactor)

    runtimeOnly mnLogging.logback.classic

    testImplementation(libs.jupiter.api)
    testImplementation(platform(mnTestResources.boms.testcontainers))
    testImplementation libs.testcontainers.elasticsearch
    testRuntimeOnly(libs.jupiter.engine)
}
