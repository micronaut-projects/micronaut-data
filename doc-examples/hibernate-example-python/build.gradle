plugins {
    id "io.micronaut.build.internal.data-python-example"
}

micronautBuild {
    python {
        // Hibernate reads the JPA annotations of the entities reflectively from the generated classes.
        // The repositories are left out: Micronaut 5.2.5 copies their internal @DataMethod annotations
        // onto the generated source, which does not compile (fixed in 5.2.6, micronaut-core#13401)
        compilerArgs.add("-Amicronaut.introspection.allowReflection=example.Account,example.AccountUsernameValidator,example.Book,example.Manufacturer,example.MonthDayDateAttributeConverter,example.Product,example.Student,example.User")
    }
}

dependencies {
    // The Python compiler takes the compile classpath as its annotation processor path
    implementation projects.micronautDataProcessor
    implementation mnValidation.micronaut.validation.processor
    implementation mnSql.hibernate.jpamodelgen
    implementation mnSerde.micronaut.serde.api
    implementation mn.micronaut.http.client
    implementation(mnRxjava3.micronaut.rxjava3)
    implementation mnSql.micronaut.hibernate.jpa
    implementation projects.micronautDataHibernateJpa
    implementation mnValidation.validation

    runtimeOnly mnSql.micronaut.jdbc.tomcat
    runtimeOnly mnLogging.logback.classic
    runtimeOnly mnSql.h2
    runtimeOnly mnValidation.micronaut.validation
}
