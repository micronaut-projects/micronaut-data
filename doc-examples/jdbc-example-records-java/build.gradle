import io.micronaut.testresources.buildtools.KnownModules

plugins {
    id "io.micronaut.build.internal.data-native-example"
}

application {
    mainClass = "example.Application"
}

micronaut {
    version libs.versions.micronaut.platform.get()
    runtime "netty"
    testRuntime "junit5"
    testResources {
        enabled = true
        inferClasspath = false
        if (providers.environmentVariable('TESTPILOT_USERNAME').isPresent()) {
            additionalModules.add(KnownModules.JDBC_ORACLE_TEST_PILOT)
        } else {
            additionalModules.add(KnownModules.JDBC_ORACLE_FREE)
        }
        clientTimeout = 300
        version = libs.versions.micronaut.testresources.get()
    }
}

dependencies {
    annotationProcessor projects.micronautDataProcessor
    annotationProcessor mnValidation.micronaut.validation

    implementation projects.micronautDataJdbc
    implementation mn.micronaut.http.client
    implementation mnValidation.micronaut.validation
    implementation(mnSql.jakarta.persistence.api)

    runtimeOnly mnSql.micronaut.jdbc.tomcat
    runtimeOnly mnLogging.logback.classic
    runtimeOnly mnSql.ojdbc11

    testResourcesService mnSql.ojdbc11
}
