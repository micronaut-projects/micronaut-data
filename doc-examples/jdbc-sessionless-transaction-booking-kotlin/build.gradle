import io.micronaut.testresources.buildtools.KnownModules

plugins {
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.kotlin.kapt"
    id "org.jetbrains.kotlin.plugin.allopen"
    id "io.micronaut.build.internal.data-kotlin-example"
    id "io.micronaut.test-resources"
}

application {
    mainClass = "example.ApplicationKt"
}

micronaut {
    version libs.versions.micronaut.platform.get()
    runtime "netty"
    testRuntime "junit5"
    testResources {
        inferClasspath = false
        additionalModules.add(KnownModules.JDBC_ORACLE_FREE)
        clientTimeout = 300
        version = libs.versions.micronaut.testresources.get()
    }
}

dependencies {
    kapt projects.micronautDataProcessor
    kapt mnValidation.micronaut.validation.processor

    implementation projects.micronautDataJdbc
    implementation mnKotlin.micronaut.kotlin.runtime
    implementation mnValidation.micronaut.validation
    implementation mnSerde.micronaut.serde.jackson

    runtimeOnly mnSql.micronaut.jdbc.tomcat
    runtimeOnly mnSql.ojdbc11
    runtimeOnly mnLogging.logback.classic

    testResourcesService mnSerde.micronaut.serde.jackson
    // The Oracle container checks its readiness over JDBC
    testResourcesService mnSql.ojdbc11
}
