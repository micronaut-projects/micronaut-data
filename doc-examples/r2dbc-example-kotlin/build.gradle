import io.micronaut.testresources.buildtools.KnownModules

plugins {
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.kotlin.kapt"
    id "org.jetbrains.kotlin.plugin.allopen"
    id "io.micronaut.test-resources"
    id "io.micronaut.build.internal.data-kotlin-example"
}

application {
    mainClass = "example.ApplicationKt"
}

micronaut {
    version libs.versions.micronaut.platform.get()
    runtime "netty"
    testRuntime "junit5"
    testResources {
        additionalModules.add(KnownModules.R2DBC_POSTGRESQL)
        clientTimeout = 300
        version = libs.versions.micronaut.testresources.get()
    }
}

dependencies {
    kapt projects.micronautDataProcessor
    implementation projects.micronautDataR2dbc
    implementation mnSql.micronaut.jdbc.hikari
    implementation libs.kotlin.coroutines
    implementation libs.kotlin.coroutines.reactor
    implementation(mn.kotlinx.coroutines.reactive)
    implementation mnSerde.micronaut.serde.support
    implementation mnKotlin.micronaut.kotlin.runtime
    implementation(mnSql.jakarta.persistence.api)

    runtimeOnly mnR2dbc.r2dbc.postgresql
    runtimeOnly mnSql.postgresql
    runtimeOnly (mnFlyway.micronaut.flyway) {
        // It is imported already and flyway might bring different version
        exclude group: 'io.micronaut.sql', module: 'micronaut-jdbc'
    }
    runtimeOnly mnFlyway.flyway.postgresql

    testImplementation mn.micronaut.http.client
    compileOnly mnSerde.micronaut.serde.api

    testResourcesService mnSql.postgresql
}
