---
micronaut:
  application:
    name: data-example
---
datasources:
  default:
    url: jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    driverClassName: org.h2.Driver
    username: sa
    password: ''
jpa:
  default:
    properties:
      uniqueResultOnFindOne: true
      hibernate:
        show_sql: true
        hbm2ddl:
          auto: update
