plugins {
    id "java-library"
    id "io.micronaut.build.internal.data-base"
    id "io.micronaut.build.internal.data-dependencies"
}

dependencies {

    testImplementation projects.micronautJakartaDataTck.micronautJakartaDataSupportTck
    testImplementation projects.micronautDataSearchOpensearch
    testImplementation mnOpensearch.micronaut.opensearch.httpclient5
    testImplementation projects.micronautDataDocumentProcessor
    testImplementation projects.micronautDataSearchDocument
    testImplementation mnValidation.micronaut.validation.processor
    testImplementation mnValidation.micronaut.validation
    // the TCK entities are introspected but not serdeable, so the documents are mapped by Jackson
    testImplementation mn.micronaut.jackson.databind
    testImplementation(platform(mnTestResources.boms.testcontainers))
    testImplementation "org.testcontainers:testcontainers"
    testImplementation mnOpensearch.opensearch.testcontainers

    testRuntimeOnly mnTest.junit.jupiter.engine
    testRuntimeOnly mnLogging.logback.classic
    testRuntimeOnly mn.snakeyaml
}

test {
    scanForTestClasses true
    systemProperty("junit.jupiter.extensions.autodetection.enabled", "true")
    useJUnitPlatform()
    // one OpenSearch container is shared by the whole run
    maxParallelForks = 1
}
