plugins {
    id "io.micronaut.build.internal.data-base"
    id "io.micronaut.build.internal.data-dependencies"
    id "io.micronaut.build.internal.module"
}

ext {
    skipDocumentation = true
}

micronautBuild {
    descriptor {
        parentModuleId = "io.micronaut.data:micronaut-data-model"
    }
    // TCK artifacts are test fixtures, not a stable public API
    binaryCompatibility {
        enabled = false
    }
}

// TCK sources are test fixtures and are not held to the production checkstyle rules
tasks.withType(Checkstyle).configureEach {
    enabled = false
}

dependencies {
    api mn.micronaut.inject.java
    api mn.micronaut.inject
    api mn.micronaut.aop
    api mn.micronaut.context

    api libs.jakarta.data.tck
    api(libs.jakarta.data.tck) {
        artifact {
            classifier = "sources"
        }
    }
    api libs.managed.jakarta.data.api
    api libs.managed.jakarta.data.stateful

    api mnLogging.slf4j.jul.to.slf4j
    api libs.jakarta.servlet.api
    api mnSql.jakarta.persistence.api

    api mnTest.junit.jupiter.api
    api libs.junit.platform.suite.engine

    compileOnly projects.micronautDataJdbc
    compileOnly projects.micronautDataMongodb
}

spotless {
    java {
        // derived from the Jakarta Data TCK, keeps its Eclipse Foundation (EPL-2.0) header
        targetExclude("src/main/java/io/micronaut/data/jakarta/tck/TCKArchiveProcessor.java")
    }
}
